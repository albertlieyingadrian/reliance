[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reliance"
version = "0.1.0"
description = "Shaping what a model relies on during training."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch", "einops"]

[tool.setuptools.packages.find]
include = ["reliance*"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: trains models; minutes rather than seconds"]
